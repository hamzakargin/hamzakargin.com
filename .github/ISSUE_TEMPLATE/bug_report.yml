name: Bug report
description: Something on the site is broken or looks wrong.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page
      description: The URL where it happens.
      placeholder: https://hamzakargin.com/blog
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page on a phone
        2. Open the menu
        3. ...
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 26, iPhone 16
    validations:
      required: true
