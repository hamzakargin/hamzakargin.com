name: Improvement
description: Suggest an improvement to the code, performance or accessibility.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What could be better, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would change it. Links to examples are welcome.
